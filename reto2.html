<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto #2 - Cabina del DJ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
    .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .card-dark { background-color: #1e293b; border: 1px solid #334155; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="card-dark rounded-2xl max-w-lg w-full p-6 shadow-2xl text-center">
    <header class="mb-6">
      <span class="bg-amber-500/20 text-amber-400 font-bold px-4 py-1.5 rounded-full text-xs uppercase">Estación #2 • Staff</span>
      <h1 class="text-2xl font-extrabold text-amber-400 mt-3">Cabina del DJ</h1>
      <p class="text-xs text-slate-400 mt-1">Social Pa'l Desparche 🎷</p>
    </header>
    <main class="space-y-4 text-left text-sm text-slate-300">
      <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/50">
        <p class="font-semibold text-white mb-2"><i class="fa-solid fa-location-dot text-amber-500 mr-2"></i>Ubicación:</p>
        <p class="text-slate-400 text-xs italic">Donde nace la música que mueve tus pies y se marca el ritmo de la noche...</p>
      </div>
      <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/50">
        <p class="font-semibold text-white mb-2"><i class="fa-solid fa-compact-disc text-amber-500 mr-2"></i>Misión:</p>
        <p class="text-xs text-slate-300">Acércate a la cabina del DJ, demuéstrale tus mejores pasos o pídele tu canción favorita para que te entregue el código de validación.</p>
      </div>
      <form onsubmit="validar(event)" class="mt-6 space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Código entregado por el DJ:</label>
          <input type="text" id="respuesta" placeholder="Ingresa el código" required class="w-full bg-slate-900 border border-slate-700 text-white font-mono text-center text-lg rounded-xl py-3 focus:outline-none focus:border-amber-500">
        </div>
        <button type="submit" class="w-full gold-gradient hover:opacity-90 text-slate-950 font-bold py-3 rounded-xl transition">Validar Código</button>
      </form>
      <div id="resultado" class="hidden text-center p-4 rounded-xl font-bold text-sm"></div>
    </main>
  </div>
  <script>
    function validar(e) {
      e.preventDefault();
      const resDiv = document.getElementById('resultado');
      resDiv.classList.remove('hidden');
      resDiv.className = "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-center p-4 rounded-xl font-bold text-sm";
      resDiv.innerHTML = `🎉 ¡Código Validado!<br><span class="text-xs font-normal">Has completado el Reto #2 en la Cabina del DJ.</span>`;
    }
  </script>
</body>
</html>
