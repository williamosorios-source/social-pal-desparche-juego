<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Reto #4 - Zona de Bebidas | Social Pa'l Desparche 💃🕺</title>

  <!-- FUENTE OFICIAL -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- TAILWIND CSS & FONT AWESOME -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      height: 100%;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 24px 24px;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-white {
      background: #ffffff;
      border: 1px solid #f1f5f9;
      box-shadow: 0 10px 30px -5px rgba(76, 29, 149, 0.08);
      box-sizing: border-box;
      width: 100%;
    }

    .brand-gradient-btn {
      background: linear-gradient(135deg, #4c1d95 0%, #7e22ce 50%, #e11d48 100%);
      transition: all 0.25s ease;
    }
    .brand-gradient-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px -5px rgba(126, 34, 206, 0.4);
    }

    .input-light {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      color: #3b0764;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 1rem;
      font-size: 16px !important;
    }
    .input-light:focus {
      border-color: #7e22ce;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(126, 34, 206, 0.1);
    }
  </style>
</head>
<body class="text-slate-800 p-4 antialiased selection:bg-purple-500 selection:text-white">

  <div class="card-white rounded-3xl max-w-md w-full p-6 shadow-xl border border-purple-100 my-auto">
    
    <!-- CABECERA DE MARCA -->
    <header class="text-center mb-6 border-b border-purple-100 pb-4">
      <span class="bg-purple-100 text-purple-900 font-extrabold px-3.5 py-1.5 rounded-full text-[10px] uppercase tracking-widest inline-block mb-2">
        ESTACIÓN #4 • BEBIDAS
      </span>
      <h1 class="text-xl font-black text-purple-950 mt-1">Zona de Comida y Bebidas 🍹</h1>
      <p class="text-[11px] text-slate-500 font-semibold mt-0.5">El Misterio de la Partitura Navideña • Social Pa'l Desparche</p>
    </header>
    
    <main class="space-y-4 text-left text-xs text-slate-700">
      <!-- MISIÓN -->
      <div class="bg-slate-50 p-4 rounded-2xl border border-purple-100 space-y-1">
        <p class="font-extrabold text-purple-950 text-[11px] uppercase tracking-wider flex items-center gap-1.5">
          <span>🥤</span> Misión:
        </p>
        <p class="text-slate-600 leading-relaxed font-medium">
          El Grinch dejó una clave oculta en esta estación. Busca en el aviso o etiqueta junto a las bebidas la palabra mágica e ingrésala <b>AL REVÉS</b> aquí para liberar la partitura.
        </p>
      </div>

      <!-- FORMULARIO DE RESPUESTA -->
      <form onsubmit="validar(event)" class="space-y-4 mt-4">
        <div>
          <label class="block text-[11px] font-extrabold text-purple-950 mb-1.5 uppercase tracking-wider">
            Ingresa la palabra Invertida:
          </label>
          <input type="text" id="respuesta" placeholder="Escribe la palabra al revés" required 
            class="w-full px-4 py-3.5 input-light font-mono text-center text-lg uppercase font-bold outline-none transition shadow-sm">
        </div>

        <button type="submit" class="w-full brand-gradient-btn text-white font-extrabold py-4 rounded-2xl text-sm transition active:scale-95 shadow-lg shadow-purple-500/25">
          Validar Partitura 🧩
        </button>
      </form>

      <!-- SECCIÓN DE RESULTADO -->
      <div id="resultado" class="hidden text-center p-4 rounded-2xl font-bold text-xs mt-4"></div>
    </main>
  </div>

  <script>
    // Solución esperada: CERVEZA al revés (AZEVREC)
    const SOL = "AZEVREC";
    const CODIGO_GANADOR = "AAA2255";

    function validar(e) {
      e.preventDefault();
      const input = document.getElementById('respuesta').value.trim().toUpperCase();
      const resDiv = document.getElementById('resultado');
      
      resDiv.classList.remove('hidden');

      if (input === SOL) {
        resDiv.className = "bg-emerald-50 text-emerald-950 border-2 border-emerald-400 p-4 rounded-2xl font-bold text-xs space-y-2 shadow-md";
        resDiv.innerHTML = `
          <div class="text-sm font-black text-emerald-800">🎉 ¡PARTITURA LIBERADA! 🎉</div>
          <p class="text-[11px] text-emerald-700 font-medium">Has descifrado correctamente la palabra invertida de la barra. Tu código para ingresar en la app principal es:</p>
          <div class="text-2xl font-black text-purple-950 bg-white py-2.5 rounded-xl border border-purple-200 tracking-wider shadow-inner font-mono">${CODIGO_GANADOR}</div>
        `;
      } else {
        resDiv.className = "bg-rose-50 text-rose-700 border border-rose-200 p-4 rounded-2xl font-bold text-xs";
        resDiv.innerHTML = `❌ Palabra incorrecta<br><span class="text-[11px] font-medium text-rose-600">Revisa la etiqueta en la zona de bebidas y recuerda escribir la palabra al revés.</span>`;
      }
    }
  </script>
</body>
</html>
